name: Build

on:
  push:
    branches: [ main, experimental ]
  pull_request:
    branches: [ main, experimental ]
  workflow_dispatch:

jobs:
  buildAndroid:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.1.7

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4

      - name: Install Haxelib
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp > /dev/null --quiet
          chmod +x ./setup/unix.sh
          sh ./setup/unix.sh

      - name: Use Bundled Lua
        run: |
          LUA_PATH=$(haxelib libpath linc_luajit)
          for LIB in "$LUA_PATH"/lib/lua/lib/Android/*.a; do printf '!<arch>\n' > "$LIB"; done

      - name: Configure Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT ${{ steps.setup-ndk.outputs.ndk-path }}
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Skip SScript setup mode
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> ~/settings.cocoa

      - name: Prepare Discord Social SDK
        env:
          DISCORD_SOCIAL_SDK_URL: ${{ secrets.DISCORD_SOCIAL_SDK_URL }}
          DISCORD_SOCIAL_SDK_TOKEN: ${{ secrets.DISCORD_SOCIAL_SDK_TOKEN }}
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
        run: |
          if [ -z "$DISCORD_SOCIAL_SDK_URL" ]; then
            echo "No DISCORD_SOCIAL_SDK_URL secret, building without Discord Rich Presence"
            exit 0
          fi
          if [ -n "$DISCORD_SOCIAL_SDK_TOKEN" ]; then
            curl -fsSL -H "Authorization: Bearer $DISCORD_SOCIAL_SDK_TOKEN" -H "Accept: application/octet-stream" -o discord_sdk.zip "$DISCORD_SOCIAL_SDK_URL"
          else
            curl -fsSL -o discord_sdk.zip "$DISCORD_SOCIAL_SDK_URL"
          fi
          sh ./setup/discord_sdk.sh android discord_sdk.zip
          rm -f discord_sdk.zip
          FLAG="-D DISCORD_SOCIAL_SDK"
          if [ -n "$DISCORD_APP_ID" ]; then FLAG="$FLAG -D DISCORD_APP_ID=$DISCORD_APP_ID"; fi
          echo "DISCORD_FLAG=$FLAG" >> $GITHUB_ENV

      - name: Prepare Signing Key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "SIGNING_FLAG=-D ANDROID_SIGNING" >> $GITHUB_ENV
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret, building with the debug key"
          fi

      - name: Compile
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: haxelib run lime build android -D officialBuild $SIGNING_FLAG $DISCORD_FLAG

      - name: Verify APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          APKS=$(find export/release/android/bin/app/build/outputs/apk -name "*.apk")
          if [ -z "$APKS" ]; then echo "No APK found"; exit 1; fi
          for APK in $APKS; do
            echo "Verifying $APK"
            "$BUILD_TOOLS/zipalign" -c -p 4 "$APK"
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          done

      - name: Publish Artifact
        uses: actions/upload-artifact@v4.3.4
        with:
          name: androidBuild
          path: export/release/android/bin/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  buildiOS:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4.1.7

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4

      - name: Install Haxelib
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp > /dev/null --quiet
          chmod +x ./setup/unix.sh
          sh ./setup/unix.sh

      - name: Use Bundled Lua
        run: |
          LUA_PATH=$(haxelib libpath linc_luajit)
          mkdir -p "$LUA_PATH/lib/lua/lib/iPhone"
          printf '!<arch>\n' > "$LUA_PATH/lib/lua/lib/iPhone/libluajit.iphoneos-64.a"
          printf '!<arch>\n' > "$LUA_PATH/lib/lua/lib/iPhone/libluajit.iphonesim-64.a"

      - name: Skip SScript setup mode
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> ~/settings.cocoa

      - name: Prepare Discord Social SDK
        env:
          DISCORD_SOCIAL_SDK_URL: ${{ secrets.DISCORD_SOCIAL_SDK_URL }}
          DISCORD_SOCIAL_SDK_TOKEN: ${{ secrets.DISCORD_SOCIAL_SDK_TOKEN }}
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
        run: |
          if [ -z "$DISCORD_SOCIAL_SDK_URL" ]; then
            echo "No DISCORD_SOCIAL_SDK_URL secret, building without Discord Rich Presence"
            exit 0
          fi
          if [ -n "$DISCORD_SOCIAL_SDK_TOKEN" ]; then
            curl -fsSL -H "Authorization: Bearer $DISCORD_SOCIAL_SDK_TOKEN" -H "Accept: application/octet-stream" -o discord_sdk.zip "$DISCORD_SOCIAL_SDK_URL"
          else
            curl -fsSL -o discord_sdk.zip "$DISCORD_SOCIAL_SDK_URL"
          fi
          sh ./setup/discord_sdk.sh ios discord_sdk.zip
          rm -f discord_sdk.zip
          FLAG="-D DISCORD_SOCIAL_SDK"
          if [ -n "$DISCORD_APP_ID" ]; then FLAG="$FLAG -D DISCORD_APP_ID=$DISCORD_APP_ID"; fi
          echo "DISCORD_FLAG=$FLAG" >> $GITHUB_ENV

      - name: Compile
        run: haxelib run lime build ios -D officialBuild $DISCORD_FLAG || echo "lime finished with errors, building the Xcode project without signing"

      - name: Build Xcode Project
        run: |
          cd export/release/ios
          PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          xcodebuild -project "$PROJECT" -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" LD_RUNPATH_SEARCH_PATHS='$(inherited) @executable_path/Frameworks' build

      - name: Package IPA
        run: |
          APP=$(find export/release/ios/build -type d -name "*.app" -path "*iphoneos*" | head -n 1)
          if [ -z "$APP" ]; then echo "No .app found"; find export/release/ios -maxdepth 4; exit 1; fi
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          FRAMEWORK=$(find project/discord/ios -type d -name "discord_partner_sdk.framework" -path "*ios-arm64*" 2>/dev/null | grep -v simulator | head -n 1 || true)
          if [ -n "$FRAMEWORK" ] && file "$FRAMEWORK/discord_partner_sdk" | grep -q "dynamically linked"; then
            mkdir -p "ipa/Payload/$(basename "$APP")/Frameworks"
            cp -R "$FRAMEWORK" "ipa/Payload/$(basename "$APP")/Frameworks/"
          fi
          cd ipa && zip -qry ../PsychEngine.ipa Payload

      - name: Publish Artifact
        uses: actions/upload-artifact@v4.3.4
        with:
          name: iOSBuild
          path: PsychEngine.ipa
          if-no-files-found: error
