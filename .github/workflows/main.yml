          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/art/*
            /art/icons/
            /art/readme.txt
            !/docs/
            !/documents-mobile/

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Restore Haxelibs
        id: hmm-cache
        uses: actions/cache@v4
        with:
          path: .haxelib
          key: hmm-windows-${{ env.HAXE_VERSION }}-${{ hashFiles('hmm.json') }}

      - name: Restore hxcpp Cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hxcpp_cache
          key: hxcpp-windows-${{ github.sha }}
          restore-keys: hxcpp-windows-

      - name: Install Haxelibs
        run: |
