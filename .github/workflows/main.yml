          echo "HXCPP_COMPILE_CACHE=$RUNNER_TEMP\\hxcpp_cache" >> $GITHUB_ENV
          echo "HXCPP_COMPILE_THREADS=$NUMBER_OF_PROCESSORS" >> $GITHUB_ENV
          haxelib --global install hmm --quiet
          if [ "${{ steps.hmm-cache.outputs.cache-hit }}" != "true" ]; then
            haxelib --global run hmm install
            (cd "$(haxelib libpath hxcpp)/tools/hxcpp" && haxe compile.hxml)
          fi
          haxelib list

      - name: Rebuild Lime
        run: |
          LIME=$(haxelib libpath lime)
          if [ ! -f "$LIME/ndll/.psych-windows" ]; then
            haxelib run lime rebuild windows -64 -release
            touch "$LIME/ndll/.psych-windows"
          fi

      - name: Skip SScript setup mode
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> ~/settings.cocoa

      - name: Compile
        run: |
          set -o pipefail
          if ! haxelib run lime build windows -D officialBuild 2>&1 | tee compile.log; then
            grep -n -i -E "error|failed|exception" compile.log | tail -n 40 > errors.log || true
            echo "::error title=lime build windows (errors)::$(sed 's/%/%25/g' errors.log | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      - name: Publish Artifact
        uses: actions/upload-artifact@v4.3.4
        with:
          name: windowsBuild
          path: export/release/windows/bin
          if-no-files-found: error

  buildMac:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4.1.7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/art/*
            /art/icons/
            /art/readme.txt
            !/docs/
            !/documents-mobile/

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Restore Haxelibs
        id: hmm-cache
        uses: actions/cache@v4
        with:
          path: .haxelib
          key: hmm-mac-${{ env.HAXE_VERSION }}-${{ hashFiles('hmm.json') }}

      - name: Restore hxcpp Cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hxcpp_cache
          key: hxcpp-mac-${{ github.sha }}
          restore-keys: hxcpp-mac-

      - name: Install Haxelibs
        run: |
          mkdir -p "$RUNNER_TEMP/hxcpp_cache"
          echo "HXCPP_COMPILE_CACHE=$RUNNER_TEMP/hxcpp_cache" >> $GITHUB_ENV
          echo "HXCPP_COMPILE_THREADS=$(sysctl -n hw.ncpu)" >> $GITHUB_ENV
          arch -x86_64 haxelib --global install hmm --quiet
          if [ "${{ steps.hmm-cache.outputs.cache-hit }}" != "true" ]; then
            arch -x86_64 haxelib --global run hmm install
            (cd "$(arch -x86_64 haxelib libpath hxcpp)/tools/hxcpp" && arch -x86_64 haxe compile.hxml)
          fi
          arch -x86_64 haxelib list

      - name: Rebuild Lime
        run: |
          LIME=$(arch -x86_64 haxelib libpath lime)
          if [ ! -f "$LIME/ndll/.psych-mac" ]; then
            arch -x86_64 haxelib run lime rebuild mac -64 -release
            touch "$LIME/ndll/.psych-mac"
          fi

      - name: Skip SScript setup mode
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> ~/settings.cocoa

      - name: Compile
        run: |
          set -o pipefail
          if ! arch -x86_64 haxelib run lime build mac -D officialBuild 2>&1 | tee compile.log; then
            grep -n -i -E "error|failed|exception" compile.log | tail -n 40 > errors.log || true
            echo "::error title=lime build mac (errors)::$(sed 's/%/%25/g' errors.log | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      - name: Package App
        run: |
          APP=$(find export/release/macos/bin -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then echo "No .app found"; find export/release/macos -maxdepth 3; exit 1; fi
          ditto -c -k --keepParent "$APP" PsychEngine-macOS.zip

      - name: Publish Artifact
        uses: actions/upload-artifact@v4.3.4
        with:
          name: macBuild
          path: PsychEngine-macOS.zip
          if-no-files-found: error
          compression-level: 0

  buildLinux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.1.7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/art/*
            /art/icons/
            /art/readme.txt
            !/docs/
            !/documents-mobile/

      - name: Install System Libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ libx11-dev libxi-dev libxext-dev libxinerama-dev libxrandr-dev libgl-dev libgl1-mesa-dev libasound2-dev libpulse-dev libwayland-bin libwayland-dev wayland-protocols libxkbcommon-dev libegl-dev libdecor-0-dev libxcursor-dev libxss-dev libxtst-dev libdbus-1-dev libudev-dev libvlc-dev libvlccore-dev

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Restore Haxelibs
        id: hmm-cache
        uses: actions/cache@v4
        with:
          path: .haxelib
          key: hmm-linux-${{ env.HAXE_VERSION }}-${{ hashFiles('hmm.json') }}

      - name: Restore hxcpp Cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hxcpp_cache
          key: hxcpp-linux-${{ github.sha }}
          restore-keys: hxcpp-linux-

      - name: Install Haxelibs
        run: |
          mkdir -p "$RUNNER_TEMP/hxcpp_cache"
          echo "HXCPP_COMPILE_CACHE=$RUNNER_TEMP/hxcpp_cache" >> $GITHUB_ENV
          echo "HXCPP_COMPILE_THREADS=$(nproc)" >> $GITHUB_ENV
          haxelib --global install hmm --quiet
          if [ "${{ steps.hmm-cache.outputs.cache-hit }}" != "true" ]; then
            haxelib --global run hmm install
            (cd "$(haxelib libpath hxcpp)/tools/hxcpp" && haxe compile.hxml)
          fi
          haxelib list

      - name: Rebuild Lime
        run: |
          LIME=$(haxelib libpath lime)
          if [ ! -f "$LIME/ndll/.psych-linux" ]; then
            haxelib run lime rebuild linux -64 -release
            touch "$LIME/ndll/.psych-linux"
          fi

      - name: Skip SScript setup mode
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> ~/settings.cocoa

      - name: Compile
        run: |
          set -o pipefail
          if ! haxelib run lime build linux -D officialBuild 2>&1 | tee compile.log; then
            grep -n -i -E "error|failed|exception" compile.log | tail -n 40 > errors.log || true
            echo "::error title=lime build linux (errors)::$(sed 's/%/%25/g' errors.log | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      - name: Package Build
        run: tar -czf PsychEngine-Linux.tar.gz -C export/release/linux/bin .

      - name: Publish Artifact
        uses: actions/upload-artifact@v4.3.4
        with:
          name: linuxBuild
          path: PsychEngine-Linux.tar.gz
          if-no-files-found: error
          compression-level: 0
